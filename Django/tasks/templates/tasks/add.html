{% extends 'tasks/layout.html' %}

{% block content %}
    <h1>Add Task</h1>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="task" placeholder="Enter task">
        <button type="submit">Add Task</button>
    </form>
    <a href="{% url 'index' %}">Back to Tasks</a>
{% endblock %}
