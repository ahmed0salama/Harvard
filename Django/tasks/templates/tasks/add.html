{% extends 'tasks/layout.html' %}

{% block content %}
    <h1>Add Task</h1>
    <form method="post" action="{% url 'tasks:add' %}">
        {% csrf_token %}
        {{ form }}
        <button type="submit">Add Task</button>
    </form>
    <a href="{% url 'tasks:index' %}">Back to Tasks</a>
{% endblock %}
